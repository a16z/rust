name: release

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
        channel:
          - stable
          - nightly
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install nightly toolchain
        id: rustc-toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-01-25
          default: true

      - uses: lukka/get-cmake@v3.27.4

      - name: Show rust version
        run: |
          cargo version
          rustup toolchain list

      - name: Check out a16z/rust
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          path: rust

      - name: Configure channel
        run: |
          sed -i.bak 's/channel = "stable"/channel = "${{ matrix.channel }}"/' config.toml
          echo "Building with channel: ${{ matrix.channel }}"
          cat config.toml
        working-directory: rust

      - name: Build
        run: make build-toolchain
        working-directory: rust

      - name: Archive
        run: tar -czvf rust-toolchain-${{ matrix.channel }}-${{ matrix.triple }}.tar.gz rust/build/host/stage2

      - name: Generate tag name
        id: tag
        run: |
          echo "release_tag=${{ matrix.channel }}-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          prerelease: true
          files: |
            rust-toolchain-${{ matrix.channel }}-${{ matrix.triple }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
